name: 24/7 Hourly Rail Job Checker

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour on the hour, 24/7
  workflow_dispatch:     # Manual "Run workflow" button

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Python job checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 check_jobs.py

      - name: Save memory state
        run: |
          git config --global user.name "JobAlertBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add state_*.txt || true
          git diff --staged --quiet || git commit -m "Update seen jobs state"
          git push

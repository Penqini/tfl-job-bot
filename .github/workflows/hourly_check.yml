name: 24/7 Hourly Rail Job Checker

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour on the hour, 24/7
  workflow_dispatch:     # Adds a manual "Run workflow" button so you can test it right now

permissions:
  contents: write        # Allows the bot to remember what jobs it already texted you about

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Python job checker
        run: python3 check_jobs.py

      - name: Save memory state
        run: |
          git config --global user.name "JobAlertBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add state_*.txt || true
          git diff --staged --quiet || git commit -m "Update seen jobs state"
          git push
